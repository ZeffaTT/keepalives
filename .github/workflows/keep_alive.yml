name: Keep Supabase Awake
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.CAREER_SUPABASE_URL }}/rest/v1/keepalive?select=id" \
            -H "apikey: ${{ secrets.CAREER_SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.CAREER_SUPABASE_KEY }}"
