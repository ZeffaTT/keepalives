name: Keep Supabase Awake
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPA_URL: ${{ secrets.CAREER_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.CAREER_SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPA_URL/rest/v1/keepalive?select=id" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY"
