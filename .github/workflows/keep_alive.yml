name: Keep Supabase Awake
   on:
     schedule:
       - cron: '17 9 * * 1,4'   # 9:17 AM UTC, Mondays and Thursdays
     workflow_dispatch:          # lets you run it manually to test
   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - name: Ping Career Studio database
           run: |
             curl --fail --silent --show-error \
               "${{ secrets.CAREER_SUPABASE_URL }}/rest/v1/keepalive?select=id" \
               -H "apikey: ${{ secrets.CAREER_SUPABASE_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.CAREER_SUPABASE_KEY }}"
